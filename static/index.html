<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenScope - AI Gardening Report Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --fg: #0f172a;
            --muted: #64748b;
            --accent: #10b981;
            --accent-hover: #059669;
            --card: #ffffff;
            --border: #e2e8f0;
            --warning: #f59e0b;
            --error: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            margin: 0;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            background: white;
            color: var(--fg);
            transition: border-color 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .card {
            background: var(--card);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        .confidence-high {
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--accent);
        }
        .confidence-medium {
            background: rgba(245, 158, 11, 0.1);
            border-left: 3px solid var(--warning);
        }
        .confidence-low {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid var(--error);
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-ready {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
        }
        .status-waiting {
            background: rgba(100, 116, 139, 0.1);
            color: var(--muted);
        }
        .env-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        .env-stat {
            text-align: center;
            padding: 12px 8px;
            border-radius: 6px;
            background: var(--bg);
        }
        .env-stat .label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .env-stat .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }
        .score-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--border);
            overflow: hidden;
            margin-top: 4px;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .photo-features {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .photo-feature {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        @media (max-width: 640px) {
            .env-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <nav class="border-b border-border/50 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold" style="color: var(--fg);">GreenScope</span>
                <span class="text-sm" style="color: var(--muted);">AI Gardening Intelligence</span>
            </div>
            <span class="text-xs" style="color: var(--muted);">v0.0.2</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <section class="mb-8 animate-fade-in-up delay-1">
            <div class="card max-w-2xl mx-auto text-center">
                <h1 class="text-3xl font-bold tracking-tight mb-2">GreenScope</h1>
                <p class="text-lg" style="color: var(--muted);">
                    Discover what you can grow based on your location, soil, and garden conditions
                </p>
            </div>
        </section>

        <section class="mb-8 animate-fade-in-up delay-2">
            <div class="card max-w-2xl mx-auto">
                <form id="generateForm" novalidate>
                    <div class="grid grid-cols-1 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium mb-2" for="location-select">
                                Location <span class="text-red-500">*</span>
                            </label>
                            <select id="location-select" class="input-field" required>
                                <option value="" disabled selected>Select a location...</option>
                                <option value="San Francisco, CA">San Francisco, CA</option>
                                <option value="New York, NY">New York, NY</option>
                                <option value="Austin, TX">Austin, TX</option>
                                <option value="Seattle, WA">Seattle, WA</option>
                                <option value="Denver, CO">Denver, CO</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2" for="photo">
                                Garden Photo (Optional)
                            </label>
                            <input type="file" id="photo" class="input-file hidden" accept="image/jpeg, image/png">
                            <button type="button" class="btn-input flex items-center gap-2"
                                style="width:100%;padding:12px 16px;border:2px dashed var(--border);border-radius:6px;background:white;cursor:pointer;color:var(--muted);"
                                onclick="document.getElementById('photo').click()">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8m8 4h-8M4 6h16c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2z"/>
                                </svg>
                                <span id="photoLabel">Upload Photo</span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary mt-6 py-3" disabled id="submitBtn">
                        <span id="btnText">Analyze My Garden</span>
                        <span id="btnLoading" class="hidden">
                            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Analyzing...
                        </span>
                    </button>
                </form>
            </div>
        </section>

        <section id="resultsSection" class="hidden mb-8">
            <div class="max-w-2xl mx-auto space-y-6">

                <div id="envCard" class="card animate-fade-in-up delay-1">
                    <h2 class="text-lg font-bold mb-3">Location Environment</h2>
                    <div id="envLocation" class="text-sm mb-3" style="color:var(--muted);"></div>
                    <div id="envGrid" class="env-grid"></div>
                </div>

                <div id="photoCard" class="card hidden animate-fade-in-up delay-2">
                    <h2 class="text-lg font-bold mb-3">Garden Analysis</h2>
                    <div id="photoFeatures" class="photo-features"></div>
                </div>

                <div class="card animate-fade-in-up delay-3">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold">Plant Recommendations</h2>
                        <span id="reportStatus" class="status-badge status-waiting">Generating...</span>
                    </div>
                    <div id="recommendations" class="space-y-4"></div>
                    <div id="exportSection" class="mt-6 pt-6 border-t border-border/50">
                        <button id="pdfBtn" class="btn-primary w-full mb-3" disabled>Download as PDF</button>
                        <button id="shareBtn" class="btn-primary w-full" disabled>Share Report</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="reportModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-8 shadow-2xl" id="modalContent">
            <h3 class="text-xl font-bold mb-4">Report Preview</h3>
            <div id="modalReport" class="space-y-4"></div>
            <button id="closeModal" class="btn-primary w-full mt-4">Close</button>
        </div>
    </div>

    <script>
        const API = {
            report: '/api/v1/generate-report',
            geocode: '/api/v1/geocode',
            reports: '/api/v1/reports/'
        };

        let currentReportId = null;

        const form = document.getElementById('generateForm');
        const locationInput = document.getElementById('location-select');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const resultsSection = document.getElementById('resultsSection');
        const recommendationsDiv = document.getElementById('recommendations');
        const envCard = document.getElementById('envCard');
        const photoCard = document.getElementById('photoCard');
        const pdfBtn = document.getElementById('pdfBtn');
        const shareBtn = document.getElementById('shareBtn');
        const reportStatus = document.getElementById('reportStatus');
        const photoInput = document.getElementById('photo');
        const photoLabel = document.getElementById('photoLabel');

        const LOCATION_COORDS = {
            'San Francisco, CA': { lat: 37.7749, lng: -122.4194 },
            'New York, NY': { lat: 40.7128, lng: -74.0060 },
            'Austin, TX': { lat: 30.2672, lng: -97.7431 },
            'Seattle, WA': { lat: 47.6062, lng: -122.3321 },
            'Denver, CO': { lat: 39.7392, lng: -104.9903 },
        };

        locationInput.addEventListener('change', () => {
            submitBtn.disabled = !locationInput.value;
        });

        photoInput.addEventListener('change', () => {
            if (photoInput.files.length > 0) {
                photoLabel.textContent = photoInput.files[0].name;
            } else {
                photoLabel.textContent = 'Upload Photo';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const location = locationInput.value;
            if (!location) {
                alert('Please select a location');
                return;
            }
            let photoData = null;
            const file = photoInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    photoData = { image_id: 'temp_' + Date.now(), filename: file.name, base64: ev.target.result };
                    await submitReport(location, photoData);
                };
                reader.readAsDataURL(file);
            } else {
                await submitReport(location, null);
            }
        });

        async function submitReport(location, photo) {
            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            btnLoading.classList.remove('hidden');

            const coords = LOCATION_COORDS[location] || { lat: 37.7749, lng: -122.4194 };

            try {
                const response = await fetch(API.report, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        location: { location, latitude: coords.lat, longitude: coords.lng },
                        photo,
                        num_recommendations: 4
                    })
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Failed to generate report');
                }
                const data = await response.json();
                currentReportId = data.report_id;
                displayReport(data);
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoading.classList.add('hidden');
            }
        }

        function displayReport(report) {
            reportStatus.className = 'status-badge status-ready';
            reportStatus.textContent = 'Report ready';

            const env = report.environment || {};
            document.getElementById('envLocation').innerHTML =
                `<strong>${report.location}</strong> &mdash; USDA Zone ${env.usda_zone || 'N/A'}`;
            document.getElementById('envGrid').innerHTML = [
                { icon: '🌡', label: 'Avg Temp', value: `${env.avg_temp_c || '?'}°C` },
                { icon: '💧', label: 'Rainfall', value: `${env.rainfall_mm || '?'}mm/yr` },
                { icon: '☀️', label: 'Sunlight', value: `${env.sunlight_hours || '?'}h/day` },
                { icon: '🌱', label: 'Soil pH', value: env.ph || '?' },
                { icon: '🪴', label: 'Soil Type', value: env.soil_type || '?' },
                { icon: '❄️', label: 'Frost Risk', value: env.frost_risk || '?' },
            ].map(s => `
                <div class="env-stat">
                    <div class="label">${s.icon} ${s.label}</div>
                    <div class="value">${s.value}</div>
                </div>
            `).join('');

            if (report.photo_analysis) {
                photoCard.classList.remove('hidden');
                document.getElementById('photoFeatures').innerHTML =
                    report.photo_analysis.features.map(f =>
                        `<span class="photo-feature">✓ ${f}</span>`
                    ).join('');
            } else {
                photoCard.classList.add('hidden');
            }

            const recs = report.recommendations;
            recommendationsDiv.innerHTML = recs.map((rec, idx) => {
                const cls = getConfidenceClass(rec.confidence_tp_percent);
                const bd = rec.score_breakdown || {};
                const scoreItems = [
                    { key: 'climate', label: 'Climate', max: 100 },
                    { key: 'ph', label: 'pH', max: 100 },
                    { key: 'sunlight', label: 'Sunlight', max: 100 },
                    { key: 'water', label: 'Water', max: 100 },
                    { key: 'soil', label: 'Soil', max: 100 },
                ];
                const breakdownHtml = scoreItems.map(s => {
                    const val = bd[s.key] || 0;
                    const color = val >= 80 ? 'var(--accent)' : val >= 60 ? 'var(--warning)' : 'var(--error)';
                    return `
                        <div style="display:flex;align-items:center;gap:8px;font-size:13px;">
                            <span style="width:70px;color:var(--muted);">${s.label}</span>
                            <div style="flex:1;" class="score-bar">
                                <div class="score-bar-fill" style="width:${val}%;background:${color};"></div>
                            </div>
                            <span style="width:35px;text-align:right;font-weight:500;">${val.toFixed(0)}</span>
                        </div>`;
                }).join('');

                return `
                <div class="confidence-${cls} animate-fade-in-up delay-${idx + 1}" style="padding:16px;border-radius:8px;margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;align-items:start;">
                        <div>
                            <h4 style="font-weight:600;font-size:17px;">${idx + 1}. ${rec.plant_name}</h4>
                            <p style="font-size:12px;color:var(--muted);font-style:italic;">${rec.scientific_name || ''}</p>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:24px;font-weight:700;color:${cls === 'high' ? 'var(--accent)' : cls === 'medium' ? 'var(--warning)' : 'var(--error)'};">
                                ${rec.confidence_tp_percent.toFixed(0)}%
                            </div>
                            <div style="font-size:11px;color:var(--muted);">Suitability</div>
                        </div>
                    </div>
                    <div style="margin-top:12px;">
                        ${breakdownHtml}
                    </div>
                    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                        <p style="font-size:13px;color:var(--muted);"><strong>Care:</strong> ${rec.care_guide}</p>
                        ${rec.growth_duration ? `<p style="font-size:12px;color:var(--muted);margin-top:4px;"><strong>Growth:</strong> ${rec.growth_duration}</p>` : ''}
                    </div>
                </div>`;
            }).join('');

            resultsSection.classList.remove('hidden');
            pdfBtn.disabled = false;
            shareBtn.disabled = false;
            currentReportId = report.report_id;
        }

        function getConfidenceClass(percent) {
            if (percent >= 80) return 'high';
            if (percent >= 60) return 'medium';
            return 'low';
        }

        pdfBtn.addEventListener('click', async () => {
            if (!currentReportId) return;
            try {
                const response = await fetch(`/api/v1/reports/${currentReportId}`);
                if (!response.ok) throw new Error('Failed to fetch report');
                const report = await response.json();
                const { jsPDF } = await import('https://cdn.skypack.dev/jspdf');
                const doc = new jsPDF();
                doc.setFontSize(18);
                doc.text('GreenScope - Gardening Report', 20, 20);
                doc.setFontSize(12);
                doc.text(`Location: ${report.location}`, 20, 35);
                doc.text(`Generated: ${new Date(report.generated_at * 1000).toLocaleDateString()}`, 20, 45);
                doc.setFontSize(14);
                doc.text('Recommendations:', 20, 60);
                let y = 75;
                report.recommendations.forEach((rec, idx) => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.setFontSize(11);
                    doc.text(`${idx + 1}. ${rec.plant_name} - ${rec.confidence_tp_percent.toFixed(0)}% suitability`, 20, y);
                    y += 8;
                    doc.setFontSize(9);
                    doc.text(`   ${rec.care_guide.substring(0, 80)}`, 20, y);
                    y += 10;
                });
                doc.save(`GreenScope-Report-${currentReportId}.pdf`);
            } catch (error) {
                const html = document.getElementById('recommendations').innerText;
                navigator.clipboard.writeText(html);
                alert('Report copied to clipboard!');
            }
        });

        shareBtn.addEventListener('click', () => {
            if (!currentReportId) return;
            const url = window.location.origin + `/api/v1/reports/${currentReportId}`;
            navigator.clipboard.writeText(url).then(() => alert('Report link copied!'));
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('reportModal').classList.add('hidden');
        });

        document.getElementById('location-select').focus();
    </script>
</body>
</html>
